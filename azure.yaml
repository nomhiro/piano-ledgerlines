name: ledgerlines

metadata:
  template: ledgerlines-bicep

infra:
  provider: bicep
  path: infra
  module: main

services:
  web:
    project: .
    language: js
    host: containerapp
    docker:
      path: ./Dockerfile
  worker:
    project: worker
    language: python
    host: containerapp
    docker:
      path: ./worker/Dockerfile
