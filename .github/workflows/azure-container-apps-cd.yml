name: Azure Container Apps CD

# Web とワーカーは別 job にしてある。ひとつの job に直列で並べていたときは、
# ワーカーイメージのビルドが一過性の失敗（配布元の HTTP 504）で落ちると、
# その前に成功していた web のデプロイまで skip された（run 32011026498）。
# 別 job なら片方の失敗がもう片方のデプロイを止めず、失敗した job だけ再実行できる。

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  web:
    name: Deploy web
    runs-on: ubuntu-latest

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      GHCR_IMAGE_NAME: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps extension is available
        uses: azure/cli@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade --allow-preview true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image to GHCR
        run: |
          IMAGE_REF="${GHCR_IMAGE_NAME}:${IMAGE_TAG}"
          LATEST_REF="${GHCR_IMAGE_NAME}:latest"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE_REF" \
            -t "$LATEST_REF" \
            .
          docker push "$IMAGE_REF"
          docker push "$LATEST_REF"

      - name: Update web Container App image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "${AZURE_CONTAINER_APP_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --image "${GHCR_IMAGE_NAME}:${IMAGE_TAG}"

  worker:
    name: Deploy analysis worker
    runs-on: ubuntu-latest

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ANALYSIS_WORKER_NAME: ${{ vars.AZURE_ANALYSIS_WORKER_NAME }}
      GHCR_WORKER_IMAGE_NAME: ghcr.io/${{ github.repository }}-analysis-worker
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps extension is available
        uses: azure/cli@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade --allow-preview true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # このビルドは採譜モデルのチェックポイント（約164MiB）を配布元から取得する。
      # 取得は worker/scripts/fetch_checkpoint.py が再試行する。
      - name: Build and push analysis worker image to GHCR
        run: |
          IMAGE_REF="${GHCR_WORKER_IMAGE_NAME}:${IMAGE_TAG}"
          LATEST_REF="${GHCR_WORKER_IMAGE_NAME}:latest"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -f worker/Dockerfile \
            -t "$IMAGE_REF" \
            -t "$LATEST_REF" \
            .
          docker push "$IMAGE_REF"
          docker push "$LATEST_REF"

      - name: Update analysis worker Container App image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "${AZURE_ANALYSIS_WORKER_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --image "${GHCR_WORKER_IMAGE_NAME}:${IMAGE_TAG}"
            REGISTRY_SERVER="$(az containerapp registry list \
              --name "${AZURE_ANALYSIS_WORKER_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query "[0].server" \
              --output tsv)"
            if [ -n "$REGISTRY_SERVER" ]; then
              az containerapp registry remove \
                --name "${AZURE_ANALYSIS_WORKER_NAME}" \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --server "$REGISTRY_SERVER"
            fi
