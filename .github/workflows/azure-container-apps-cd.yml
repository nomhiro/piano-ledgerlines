name: Azure Container Apps CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      GHCR_IMAGE_NAME: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps extension is available
        uses: azure/cli@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade --allow-preview true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image to GHCR
        run: |
          IMAGE_REF="${GHCR_IMAGE_NAME}:${IMAGE_TAG}"
          LATEST_REF="${GHCR_IMAGE_NAME}:latest"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE_REF" \
            -t "$LATEST_REF" \
            .
          docker push "$IMAGE_REF"
          docker push "$LATEST_REF"

      - name: Update Azure Container App image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "${AZURE_CONTAINER_APP_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --image "${GHCR_IMAGE_NAME}:${IMAGE_TAG}"
