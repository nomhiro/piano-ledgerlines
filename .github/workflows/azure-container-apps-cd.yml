name: Azure Container Apps CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      WEB_IMAGE_NAME: ${{ vars.WEB_IMAGE_NAME }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps extension is available
        uses: azure/cli@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade --allow-preview true

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name "${ACR_NAME}"

      - name: Build and push web image
        run: |
          IMAGE_REF="${ACR_NAME}.azurecr.io/${WEB_IMAGE_NAME}:${IMAGE_TAG}"
          LATEST_REF="${ACR_NAME}.azurecr.io/${WEB_IMAGE_NAME}:latest"
          docker build -t "$IMAGE_REF" -t "$LATEST_REF" .
          docker push "$IMAGE_REF"
          docker push "$LATEST_REF"

      - name: Update Azure Container App image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "${AZURE_CONTAINER_APP_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --image "${ACR_NAME}.azurecr.io/${WEB_IMAGE_NAME}:${IMAGE_TAG}"
