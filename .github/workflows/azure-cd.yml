name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy web app
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push Docker image
        id: image
        uses: azure/cli@v2
        with:
          inlineScript: |
            ACR_NAME="${{ vars.ACR_NAME }}"
            IMAGE_NAME="${{ vars.WEB_IMAGE_NAME }}"
            IMAGE_TAG="${{ github.sha }}"

            az acr build \
              --registry "$ACR_NAME" \
              --image "$IMAGE_NAME:$IMAGE_TAG" \
              --file ./Dockerfile .

            IMAGE_REF="$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)/$IMAGE_NAME:$IMAGE_TAG"
            echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Deploy image to Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          imageToDeploy: ${{ steps.image.outputs.image_ref }}
